<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="loginpage.css">
    <title>Login Page</title>
    <script>
        function saveData() {
            const username = document.querySelector('input[placeholder="Username"]').value;
            if (username) {
                sessionStorage.setItem('username', username); // Store username in sessionStorage
            }
        }
    </script>
</head>
<body>
    <div class="wrapper">     
        <img src="img.png" alt="">
        <div class="form-wrapper login">
            <form>  
                <h2>Login</h2>
                <div class="input-box">
                    <input type="text" placeholder="Username" required>
                </div>
                <div class="input-box">
                    <input type="password" placeholder="Password" required>
                </div>
                <div class="forgot-pass">
                    <a href="#">Forgot Password?</a>
                </div>
                <!-- Add onsubmit="saveData()" to ensure username is stored before navigation -->
                <button type="submit" onclick="saveData()"> 
                    <a href="mainpage.html">Login</a>
                </button>
                <div class="sign-link">
                    <p>Don't have an account? <a href="#" onclick="registerActive()">Register</a></p>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
